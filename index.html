<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A2B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>开销簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E6E1; --paper2:#DCDED8; --ink:#1F1E24; --faint:#7C7A80; --rule:#B9BCB5;
  --food:#C2452D; --trans:#1E8A8A; --daily:#2E7D5B; --fun:#6B4E9B;
  --health:#3A6EA5; --work:#D08A2E; --other:#6E6A6B;
}
*{box-sizing:border-box}
body{margin:0;background:#2A2B2E;padding:14px 10px calc(40px + env(safe-area-inset-bottom));
  font-family:'DM Mono',ui-monospace,Menlo,'PingFang SC','Noto Sans SC',monospace;color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.strip{max-width:430px;margin:0 auto;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45))}
.tear{height:10px;background-image:
  linear-gradient(135deg,var(--paper) 50%,transparent 50%),
  linear-gradient(-135deg,var(--paper) 50%,transparent 50%);
  background-size:12px 12px;background-repeat:repeat-x}
.tear.top{transform:scaleY(-1)}
.body{background:var(--paper);padding:16px 18px 20px}

.mast{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px}
.title{font-family:'Bricolage Grotesque','PingFang SC',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1}
.sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.mono-n{font-variant-numeric:tabular-nums}

.tabs{display:flex;margin:14px 0 4px;border:1px solid var(--ink)}
.tab{flex:1;background:none;border:0;padding:10px 0;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.tab+.tab{border-left:1px solid var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}

hr.dash{border:0;border-top:1px dashed var(--rule);margin:16px 0}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}

.amtwrap{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.rm{font-size:15px;color:var(--faint)}
.amt{flex:1;min-width:0;border:0;background:none;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
  font-size:40px;line-height:1.15;color:var(--ink);padding:0;letter-spacing:-.03em}
.amt:focus{outline:none}
.amt::placeholder{color:#C3C5BF}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font:inherit;font-size:13px;padding:7px 11px;border:1px solid var(--rule);background:none;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.field{width:100%;font:inherit;font-size:14px;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:9px 0;color:var(--ink)}
.field:focus{outline:none;border-bottom-color:var(--ink)}
.row2{display:flex;gap:14px;margin-top:6px}
.row2 .field.date{flex:none;width:140px}

.actions{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;font:inherit;font-size:14px;padding:14px 0;border:1px solid var(--ink);background:var(--ink);
  color:var(--paper);cursor:pointer;text-align:center;line-height:1}
.btn.ghost{background:none;color:var(--ink)}
.btn:disabled{opacity:.45}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

.hint{font-size:11px;color:var(--faint);margin-top:9px;line-height:1.7}
.err{margin-top:12px;border-left:3px solid var(--food);padding:7px 10px;font-size:13px;background:var(--paper2)}
.scan{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint);margin-top:16px}
.pulse{width:9px;height:9px;background:var(--ink);animation:p 1s steps(2) infinite}
@keyframes p{50%{opacity:.15}}

.card{border:1px solid var(--ink);padding:12px 13px;margin-top:16px;background:var(--paper2)}

.day{font-size:11px;letter-spacing:.14em;color:var(--faint);margin:16px 0 6px}
.line{display:flex;align-items:baseline;gap:6px;padding:6px 0}
.line.tap{cursor:pointer}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;max-width:56%}
.lead{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px);min-width:16px}
.val{font-size:14px;font-variant-numeric:tabular-nums}
.sub-items{font-size:11px;color:var(--faint);padding:0 0 6px 14px;line-height:1.7}
.del{font:inherit;font-size:11px;border:0;background:none;color:var(--food);cursor:pointer;padding:2px 0 10px 14px}

.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);
  border-bottom:2px solid var(--ink);padding:11px 0;margin-top:18px}
.total .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.03em}

.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.nav button{font:inherit;font-size:16px;border:1px solid var(--rule);background:none;color:var(--ink);
  width:34px;height:34px;cursor:pointer}
.nav button:disabled{opacity:.3}

.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px}
.barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar{width:100%;background:var(--rule);min-height:2px}
.bar.on{background:var(--ink)}
.barlab{font-size:10px;color:var(--faint);margin-top:5px}

.empty{text-align:center;color:var(--faint);font-size:13px;padding:34px 10px;line-height:1.9}
.foot{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--faint);margin-top:22px;text-transform:uppercase}
.foot button{font:inherit;font-size:10px;letter-spacing:.18em;border:0;background:none;color:var(--faint);
  text-decoration:underline;cursor:pointer;text-transform:uppercase}
textarea.paste{width:100%;font:inherit;font-size:12px;line-height:1.6;background:var(--paper);border:1px solid var(--rule);
  color:var(--ink);padding:8px;margin-top:4px;resize:vertical}
textarea.paste:focus{outline:none;border-color:var(--ink)}
:focus-visible{outline:2px solid var(--health);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div class="strip">
  <div class="tear top"></div>
  <div class="body">

    <div class="mast">
      <div>
        <div class="title">开销簿</div>
        <div class="sub">Ringgit ledger</div>
      </div>
      <div style="text-align:right">
        <div class="sub">本月合计</div>
        <div class="mono-n" style="font-size:15px" id="mastTotal">RM 0.00</div>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabLog" aria-selected="true">记一笔</button>
      <button class="tab" role="tab" id="tabStat" aria-selected="false">看去向</button>
    </div>

    <!-- ============ 记一笔 ============ -->
    <section id="viewLog">
      <hr class="dash">
      <div class="eyebrow">手动记</div>
      <div class="amtwrap">
        <span class="rm">RM</span>
        <input class="amt" id="inAmt" inputmode="decimal" placeholder="0.00" aria-label="金额">
      </div>
      <div class="chips" id="chipsMain"></div>
      <div class="row2">
        <input class="field" id="inNote" placeholder="买了什么 / 在哪里" aria-label="备注">
        <input class="field date" id="inDate" type="date" aria-label="日期">
      </div>
      <div class="actions">
        <button class="btn" id="btnSave">记下</button>
        <button class="btn ghost" id="btnPasteToggle">贴收据（从 Claude 对话）</button>
      </div>
      <div class="card" id="pasteCard" hidden>
        <div class="eyebrow">把收据照片发给 Claude，它回一段，贴这里</div>
        <textarea class="paste" id="pasteArea" rows="3" placeholder="2026-07-01 | AEON Metro Prima | 26.95 | daily"></textarea>
        <div class="actions">
          <button class="btn" id="btnPasteGo">解析</button>
          <button class="btn ghost" id="btnPasteCancel">收起</button>
        </div>
      </div>
      <div class="hint">收据拍照发到 Claude 对话，把它回你的那行贴进上面「贴收据」，解析后核对再存。</div>

      <div class="err" id="errBox" hidden></div>

      <!-- 核对卡 -->
      <div class="card" id="draftCard" hidden>
        <div class="eyebrow">读到这些，对了再存</div>
        <div class="amtwrap" style="margin-top:4px">
          <span class="rm">RM</span>
          <input class="amt" id="dAmt" style="font-size:32px" inputmode="decimal" aria-label="收据总额">
        </div>
        <div id="dWarn" style="font-size:12px;color:var(--food);margin-top:6px" hidden></div>
        <div class="row2">
          <input class="field" id="dNote" placeholder="商家" aria-label="商家">
          <input class="field date" id="dDate" type="date" aria-label="收据日期">
        </div>
        <div class="chips" id="chipsDraft"></div>
        <div class="sub-items" id="dItems" style="padding-left:0;margin-top:10px"></div>
        <div class="actions">
          <button class="btn" id="btnKeep">存入</button>
          <button class="btn ghost" id="btnDrop">丢掉</button>
        </div>
      </div>

      <hr class="dash">
      <div class="eyebrow" id="logHead">本月的账</div>
      <div id="logList"></div>
      <div class="total" id="logTotal" hidden>
        <span style="font-size:12px;letter-spacing:.2em;color:var(--faint)">本月总额</span>
        <span class="big mono-n" id="logTotalVal">RM 0.00</span>
      </div>
    </section>

    <!-- ============ 看去向 ============ -->
    <section id="viewStat" hidden>
      <hr class="dash">
      <div class="nav">
        <button id="prevMo" aria-label="上个月">‹</button>
        <span id="moLabel" style="font-size:14px"></span>
        <button id="nextMo" aria-label="下个月">›</button>
      </div>
      <div id="statBody"></div>
    </section>

    <div class="foot">
      <span id="footCount">0 笔</span> ·
      <button id="btnExport">导出 CSV</button>
    </div>

  </div>
  <div class="tear"></div>
</div>

<script>
/* ================= 常量 ================= */
const CATS=[
 {id:"food",  label:"餐饮",color:"#C2452D"},
 {id:"trans", label:"交通",color:"#1E8A8A"},
 {id:"daily", label:"日用",color:"#2E7D5B"},
 {id:"fun",   label:"娱乐",color:"#6B4E9B"},
 {id:"health",label:"健康",color:"#3A6EA5"},
 {id:"work",  label:"工作",color:"#D08A2E"},
 {id:"other", label:"其他",color:"#6E6A6B"}
];
const catOf=id=>CATS.find(c=>c.id===id)||CATS[6];
const DATA_KEY="ledger.rows.v1";
const $=id=>document.getElementById(id);
const rm=n=>(Number(n)||0).toFixed(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const monthOf=d=>(d||"").slice(0,7);
const moLabel=m=>`${m.slice(0,4)} 年 ${Number(m.slice(5,7))} 月`;

/* ================= 状态 ================= */
let rows=[], month=monthOf(today()), cat="food", dcat="daily", draft=null;

function load(){ try{ rows=JSON.parse(localStorage.getItem(DATA_KEY))||[] }catch{ rows=[] } }
function save(){
  try{ localStorage.setItem(DATA_KEY,JSON.stringify(rows)); return true }
  catch{ return false }
}


/* ================= 提示 ================= */
function err(msg){ const b=$("errBox"); if(!msg){b.hidden=true;return} b.textContent=msg; b.hidden=false }

/* ================= 分类按钮 ================= */
function chips(host,current,onPick){
  host.innerHTML="";
  CATS.forEach(c=>{
    const b=document.createElement("button");
    b.className="chip"; b.setAttribute("aria-pressed",String(c.id===current()));
    b.innerHTML=`<span class="dot" style="background:${c.color}"></span>${c.label}`;
    b.onclick=()=>{ onPick(c.id); chips(host,current,onPick) };
    host.appendChild(b);
  });
}

/* ================= 增删 ================= */
function addRow(e){
  rows.unshift({id:Date.now()+Math.random().toString(36).slice(2,6),...e});
  if(!save()) err("存不进去，浏览器可能开了无痕模式");
  render();
}
function delRow(id){ rows=rows.filter(r=>r.id!==id); save(); render() }

/* ================= 渲染 ================= */
function render(){
  const inMo=rows.filter(r=>monthOf(r.date)===month);
  const tot=inMo.reduce((s,r)=>s+r.amount,0);
  $("mastTotal").textContent="RM "+rm(tot);
  $("footCount").textContent=rows.length+" 笔";
  $("logHead").textContent=moLabel(month)+" 的账";
  $("moLabel").textContent=moLabel(month);
  $("nextMo").disabled = month>=monthOf(today());

  /* --- 流水 --- */
  const list=$("logList"); list.innerHTML="";
  if(!inMo.length){
    list.innerHTML='<div class="empty">这个月还没记过。<br>上面填个数字，或者拍张收据。</div>';
    $("logTotal").hidden=true;
  }else{
    const byDay={};
    inMo.forEach(r=>{ (byDay[r.date]=byDay[r.date]||[]).push(r) });
    Object.keys(byDay).sort().reverse().forEach(d=>{
      const dt=document.createElement("div");
      dt.className="day";
      dt.textContent=`${d}　·　RM ${rm(byDay[d].reduce((s,r)=>s+r.amount,0))}`;
      list.appendChild(dt);
      byDay[d].forEach(r=>list.appendChild(entryEl(r)));
    });
    $("logTotal").hidden=false;
    $("logTotalVal").textContent="RM "+rm(tot);
  }

  /* --- 统计 --- */
  const agg={}; inMo.forEach(r=>agg[r.cat]=(agg[r.cat]||0)+r.amount);
  const byCat=CATS.map(c=>({...c,value:agg[c.id]||0})).filter(c=>c.value>0).sort((a,b)=>b.value-a.value);
  const sb=$("statBody");
  if(!byCat.length){ sb.innerHTML='<div class="empty">这个月没有数据。<br>记几笔再回来看。</div>'; return }

  let h=donut(byCat,tot);
  h+='<div class="eyebrow" style="margin-top:14px">花在哪</div>';
  byCat.forEach(c=>{
    h+=`<div class="line"><span class="dot" style="background:${c.color}"></span>
        <span class="nm">${c.label}</span><span class="lead"></span>
        <span class="val">${Math.round(c.value/tot*100)}%　RM ${rm(c.value)}</span></div>`;
  });
  h+=`<div class="total"><span style="font-size:12px;letter-spacing:.2em;color:var(--faint)">合计</span>
      <span class="big mono-n">RM ${rm(tot)}</span></div>`;

  /* 六个月 */
  const tr=[], base=new Date(month+"-01T00:00:00");
  for(let i=5;i>=0;i--){
    const d=new Date(base.getFullYear(),base.getMonth()-i,1);
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    tr.push({k,m:(d.getMonth()+1)+"月",v:rows.filter(r=>monthOf(r.date)===k).reduce((s,r)=>s+r.amount,0)});
  }
  const mx=Math.max(...tr.map(t=>t.v),1);
  h+='<div class="eyebrow" style="margin-top:22px">近六个月</div><div class="bars">';
  tr.forEach(t=>{
    h+=`<div class="barcol"><div class="bar ${t.k===month?"on":""}" style="height:${Math.round(t.v/mx*88)}%"
         title="RM ${rm(t.v)}"></div><div class="barlab">${t.m}</div></div>`;
  });
  h+='</div>';
  h+=`<div class="line"><span class="nm">六个月平均</span><span class="lead"></span>
      <span class="val">RM ${rm(tr.reduce((s,t)=>s+t.v,0)/6)}</span></div>`;
  h+=`<div class="line"><span class="nm">本月笔数</span><span class="lead"></span>
      <span class="val">${inMo.length}</span></div>`;
  sb.innerHTML=h;
}

/* 环形图（纯 SVG，无外部库） */
function donut(data,total){
  const R=54,r=34,cx=64,cy=64;
  let a=-Math.PI/2, out="";
  data.forEach(d=>{
    const sweep=d.value/total*Math.PI*2, b=a+sweep, big=sweep>Math.PI?1:0;
    if(data.length===1){
      out+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${d.color}" stroke-width="${R-r}"/>`;
    }else{
      const p=(rad,ang)=>[cx+rad*Math.cos(ang),cy+rad*Math.sin(ang)];
      const [x1,y1]=p(R,a),[x2,y2]=p(R,b),[x3,y3]=p(r,b),[x4,y4]=p(r,a);
      out+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z"
             fill="${d.color}" stroke="#E4E6E1" stroke-width="1.5"/>`;
    }
    a=b;
  });
  return `<div style="text-align:center;margin:12px 0 2px">
    <svg viewBox="0 0 128 128" width="150" height="150" role="img" aria-label="分类占比">${out}</svg></div>`;
}

function entryEl(r){
  const c=catOf(r.cat), wrap=document.createElement("div");
  const head=document.createElement("div");
  head.className="line tap";
  head.innerHTML=`<span class="dot" style="background:${c.color}"></span>
    <span class="nm">${esc(r.note)||c.label}</span><span class="lead"></span>
    <span class="val">${rm(r.amount)}</span>`;
  const detail=document.createElement("div"); detail.hidden=true;
  let dh="";
  if(r.items&&r.items.length){
    dh+='<div class="sub-items">'+r.items.map(i=>`${esc(i.name)}　${i.amount!=null?rm(i.amount):""}`).join("<br>")+'</div>';
  }
  detail.innerHTML=dh+'<button class="del">删掉这笔</button>';
  detail.querySelector(".del").onclick=()=>{ if(confirm("删掉这笔？")) delRow(r.id) };
  head.onclick=()=>detail.hidden=!detail.hidden;
  wrap.append(head,detail);
  return wrap;
}
const esc=s=>String(s==null?"":s).replace(/[<>&]/g,m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]));

function showDraft(r){
  draft=r;
  dcat=CATS.some(c=>c.id===r.category)?r.category:"other";
  $("dAmt").value=r.total!=null?String(r.total):"";
  $("dNote").value=r.merchant||"";
  $("dDate").value=/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")?r.date:today();
  const w=$("dWarn");
  if(r.currency&&String(r.currency).toUpperCase()!=="MYR"){
    w.textContent=`收据上是 ${r.currency}，这本子只记马币，自己换算`; w.hidden=false;
  }else w.hidden=true;
  const items=Array.isArray(r.items)?r.items.filter(i=>i&&i.name):[];
  $("dItems").innerHTML=items.map(i=>`${esc(i.name)}　${i.amount!=null?rm(i.amount):""}`).join("<br>");
  chips($("chipsDraft"),()=>dcat,v=>dcat=v);
  $("draftCard").hidden=false;
  $("draftCard").scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ================= 事件 ================= */
function init(){
  load();
  $("inDate").value=today();
  chips($("chipsMain"),()=>cat,v=>cat=v);

  $("tabLog").onclick=()=>swap(true);
  $("tabStat").onclick=()=>swap(false);
  function swap(log){
    $("tabLog").setAttribute("aria-selected",String(log));
    $("tabStat").setAttribute("aria-selected",String(!log));
    $("viewLog").hidden=!log; $("viewStat").hidden=log;
  }

  $("btnSave").onclick=()=>{
    const v=parseFloat($("inAmt").value);
    if(!v||v<=0){ err("填个金额，多少钱？"); return }
    err("");
    addRow({amount:v,cat,note:$("inNote").value.trim(),date:$("inDate").value||today(),items:[]});
    $("inAmt").value=""; $("inNote").value="";
  };
  $("inAmt").oninput=e=>e.target.value=e.target.value.replace(/[^\d.]/g,"");
  $("inAmt").onkeydown=e=>{ if(e.key==="Enter") $("btnSave").click() };

  $("btnPasteToggle").onclick=()=>{ $("pasteCard").hidden=!$("pasteCard").hidden; err("") };
  $("btnPasteCancel").onclick=()=>{ $("pasteCard").hidden=true; $("pasteArea").value=""; err("") };
  $("btnPasteGo").onclick=()=>{
    const t=$("pasteArea").value.trim();
    if(!t) return;
    err("");
    const a=t.indexOf("{"), b=t.lastIndexOf("}");
    if(a>=0&&b>a){
      try{
        const r=JSON.parse(t.slice(a,b+1));
        showDraft(r);
        $("pasteArea").value=""; $("pasteCard").hidden=true;
        return;
      }catch{ /* 掉到管道格式 */ }
    }
    const p=t.split("|").map(s=>s.trim());
    const v=parseFloat(p[2]);
    if(p.length>=3&&v>0){
      showDraft({
        total:v,
        category:CATS.some(c=>c.id===p[3])?p[3]:"other",
        merchant:p[1]||"",
        date:/^\d{4}-\d{2}-\d{2}$/.test(p[0])?p[0]:today(),
        currency:"MYR", items:[]
      });
      $("pasteArea").value=""; $("pasteCard").hidden=true;
      return;
    }
    err("看不懂这段。要 JSON，或者「日期|商家|金额|分类」");
  };

  $("btnKeep").onclick=()=>{
    const v=parseFloat($("dAmt").value);
    if(!v||v<=0){ err("总额是空的，填了才能存"); return }
    err("");
    addRow({amount:v,cat:dcat,note:$("dNote").value.trim(),date:$("dDate").value||today(),
            items:(draft.items||[]).filter(i=>i&&i.name)});
    $("draftCard").hidden=true; draft=null;
  };
  $("btnDrop").onclick=()=>{ $("draftCard").hidden=true; draft=null; err("") };
  $("dAmt").oninput=e=>e.target.value=e.target.value.replace(/[^\d.]/g,"");

  $("prevMo").onclick=()=>shift(-1);
  $("nextMo").onclick=()=>shift(1);
  function shift(n){
    const d=new Date(month+"-01T00:00:00"); d.setMonth(d.getMonth()+n);
    month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    render();
  }

  $("btnExport").onclick=()=>{
    const head="日期,商家,金额RM,分类,明细";
    const body=[...rows].sort((a,b)=>a.date<b.date?-1:1).map(r=>{
      const items=(r.items||[]).map(i=>`${i.name} ${i.amount!=null?rm(i.amount):""}`).join(" / ");
      const q=s=>`"${String(s==null?"":s).replace(/"/g,'""')}"`;
      return [r.date,q(r.note),rm(r.amount),catOf(r.cat).label,q(items)].join(",");
    }).join("\n");
    const csv=head+"\n"+body;
    navigator.clipboard?.writeText(csv).then(
      ()=>alert("已复制 "+rows.length+" 笔，去 Google Sheets 粘贴"),
      ()=>prompt("手动复制：",csv)
    );
  };

  render();
}
init();
</script>
</body>
</html>
