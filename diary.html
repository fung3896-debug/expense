<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="翻盘日记">
<title>翻盘日记</title>
<style>
:root{--bg:#14161c;--card:#1d2029;--tx:#ece8df;--mut:#8a8f9c;--ac:#d4b26a;--ok:#6fbf8e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang SC",sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 14px 90px;max-width:560px;margin:auto}
h1{font-size:20px;margin:6px 0;color:var(--ac);letter-spacing:2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--card);color:var(--mut);font-size:15px}
.tabs button.on{color:var(--bg);background:var(--ac)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--ac)}
input[type=text],input[type=number],textarea{width:100%;background:#13151b;color:var(--tx);border:1px solid #2c303b;border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
textarea{min-height:70px}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);flex:none}
.mood{display:flex;gap:8px}
.mood button{flex:1;padding:10px;border:1px solid #2c303b;border-radius:10px;background:#13151b;color:var(--tx);font-size:16px}
.mood button.on{background:var(--ac);color:var(--bg)}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--bg);font-size:15px;margin-right:8px;margin-top:6px}
.btn.g{background:#2c303b;color:var(--tx)}
.idea{font-size:17px;line-height:1.5;margin:6px 0}
.h{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #2c303b}
.h:last-child{border:0}
.hide{display:none}
label{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<h1>翻盘日记</h1>
<div class="sub"><span id="date"></span> · 连续复盘 <b id="streak">0</b> 天</div>
<div class="tabs">
<button id="tab0" class="on">今天</button>
<button id="tab1">想法库</button>
<button id="tab2">记录</button>
</div>

<div id="p0">
<div class="card">
<h2>早上</h2>
<label>今天翻盘的一件事</label>
<input type="text" id="flip" placeholder="例如：手机放另一个房间，专注30分钟">
<button class="btn g" id="drawTop">从想法库抽一条</button>
<div id="drawTopTxt" class="idea"></div>
<label>今天最重要的3件事（做完就勾）</label>
<div class="row"><input type="checkbox" id="d0"><input type="text" id="t0"></div>
<div class="row"><input type="checkbox" id="d1"><input type="text" id="t1"></div>
<div class="row"><input type="checkbox" id="d2"><input type="text" id="t2"></div>
</div>
<div class="card">
<h2>晚上</h2>
<label>无目的刷FB/短视频（分钟）</label>
<input type="number" id="fb" inputmode="numeric">
<label>情绪（1低 5高）</label>
<div class="mood">
<button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button>
</div>
<label>一句话复盘</label>
<textarea id="review"></textarea>
<label>明天只改一个地方</label>
<input type="text" id="tomorrow">
</div>
</div>

<div id="p1" class="hide">
<div class="card">
<h2>随机一条</h2>
<div id="idea" class="idea">点下面按钮</div>
<button class="btn" id="draw">抽一条</button>
<button class="btn g" id="setFlip">设为今天翻盘</button>
</div>
<div class="card">
<h2>编辑想法库（一行一条）</h2>
<textarea id="ideas" style="min-height:200px"></textarea>
<button class="btn" id="saveIdeas">保存</button>
</div>
</div>

<div id="p2" class="hide">
<div class="card">
<h2>最近14天</h2>
<div id="hist"></div>
</div>
<div class="card">
<h2>导出 / 导入（每周导出一次，丢给Colab出周报）</h2>
<button class="btn" id="exp">复制全部数据</button>
<button class="btn g" id="imp">用粘贴内容覆盖</button>
<textarea id="box" placeholder="导出的内容会出现在这里；导入时把内容粘贴到这里" style="min-height:120px;margin-top:8px"></textarea>
</div>
</div>

<script>
const K='fanpan_v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.days){S={days:{},ideas:["先开始5分钟，再决定要不要停","手机放到另一个房间，专注30分钟","不等状态好，固定时间开始","说话慢一点，先听完再回"]}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const day=today();
const blank=()=>({flip:'',t:['','',''],d:[0,0,0],fb:'',mood:0,review:'',tomorrow:''});
function put(fn){const x=S.days[day]||(S.days[day]=blank());fn(x);save();renderHist()}
function pick(){const a=S.ideas.filter(s=>s.trim());return a.length?a[Math.floor(Math.random()*a.length)]:''}

function load(){
 const x=S.days[day]||blank();
 $('date').textContent=day;
 $('flip').value=x.flip;
 for(let i=0;i<3;i++){$('t'+i).value=x.t[i]||'';$('d'+i).checked=!!x.d[i]}
 $('fb').value=x.fb;$('review').value=x.review;$('tomorrow').value=x.tomorrow;
 document.querySelectorAll('.mood button').forEach(b=>b.classList.toggle('on',+b.dataset.v===x.mood));
 $('ideas').value=S.ideas.join('\n');
 renderHist();
}
function streak(){
 let n=0;const d=new Date();
 const key=dt=>dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
 if(!(S.days[key(d)]&&S.days[key(d)].review.trim()))d.setDate(d.getDate()-1);
 while(S.days[key(d)]&&S.days[key(d)].review.trim()){n++;d.setDate(d.getDate()-1)}
 return n;
}
function renderHist(){
 $('streak').textContent=streak();
 const ks=Object.keys(S.days).sort().reverse().slice(0,14);
 $('hist').innerHTML=ks.map(k=>{
  const x=S.days[k];const tot=x.t.filter(s=>s.trim()).length;const dn=x.d.reduce((a,b)=>a+b,0);
  return '<div class="h"><span>'+k.slice(5)+'</span><span>完成 '+dn+'/'+tot+'</span><span>刷 '+(x.fb||0)+'分</span><span>情绪 '+(x.mood||'-')+'</span></div>';
 }).join('')||'还没有记录';
}

$('flip').oninput=e=>put(x=>x.flip=e.target.value);
[0,1,2].forEach(i=>{
 $('t'+i).oninput=e=>put(x=>x.t[i]=e.target.value);
 $('d'+i).onchange=e=>put(x=>x.d[i]=e.target.checked?1:0);
});
$('fb').oninput=e=>put(x=>x.fb=e.target.value);
$('review').oninput=e=>put(x=>x.review=e.target.value);
$('tomorrow').oninput=e=>put(x=>x.tomorrow=e.target.value);
document.querySelectorAll('.mood button').forEach(b=>b.onclick=()=>{
 put(x=>x.mood=+b.dataset.v);
 document.querySelectorAll('.mood button').forEach(c=>c.classList.toggle('on',c===b));
});
$('drawTop').onclick=()=>{const s=pick();$('drawTopTxt').textContent=s;if(s&&!$('flip').value){$('flip').value=s;put(x=>x.flip=s)}};
$('draw').onclick=()=>{$('idea').textContent=pick()||'想法库是空的'};
$('setFlip').onclick=()=>{const s=$('idea').textContent;if(s&&s!=='点下面按钮'){$('flip').value=s;put(x=>x.flip=s);show(0)}};
$('saveIdeas').onclick=()=>{S.ideas=$('ideas').value.split('\n').map(s=>s.trim()).filter(Boolean);save();alert('已保存 '+S.ideas.length+' 条')};
$('exp').onclick=()=>{
 const t=JSON.stringify(S);$('box').value=t;$('box').select();
 try{navigator.clipboard.writeText(t).then(()=>alert('已复制'),()=>alert('请长按文本框手动复制'))}catch(e){alert('请长按文本框手动复制')}
};
$('imp').onclick=()=>{
 try{const o=JSON.parse($('box').value);if(!o.days||!o.ideas)throw 0;
  if(confirm('会覆盖现有数据，确定？')){S=o;save();load()}}catch(e){alert('内容格式不对')}
};
function show(n){[0,1,2].forEach(i=>{$('p'+i).classList.toggle('hide',i!==n);$('tab'+i).classList.toggle('on',i===n)})}
[0,1,2].forEach(i=>$('tab'+i).onclick=()=>show(i));
load();
</script>
</body>
</html>
