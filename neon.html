<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>霓虹边缘 + 极光 + Euphoria</title>
<style>
  :root {
    --bg: #f4f4f6; --fg: #1d1d22; --muted: #666;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #ddd; --muted: #999; color-scheme: dark; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:sans-serif; font-size:14px; }
  .bar { padding:8px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  canvas { width:100%; display:block; background:#000; }
  button, select { padding:6px 12px; font-size:14px; }
  label { display:flex; align-items:center; gap:4px; }
  #msg { padding:0 8px; color:var(--muted); }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>

<div class="bar">
  <label>风格
    <select id="mode">
      <option value="euphoria" selected>Euphoria</option>
      <option value="aurora">极光</option>
      <option value="dream">梦幻</option>
      <option value="off">无</option>
    </select>
  </label>
  <label>强度 <input id="aur" type="range" min="0" max="100" value="70"></label>
  <label><input id="edges" type="checkbox"> 边缘</label>
  <label>阈值 <input id="gain" type="range" min="15" max="200" value="60"></label>
  <label>色相 <input id="hue" type="range" min="0" max="359" value="0"></label>
  <label><input id="rainbow" type="checkbox" checked> 彩虹</label>
  <button id="start">开启摄像头</button>
  <button id="shot">拍照保存</button>
  <button id="flip">切换前后摄像头</button>
  <button id="stop">停止</button>
</div>
<canvas id="c" width="480" height="360"></canvas>
<p id="msg">点“开启摄像头”开始。</p>

<script>
(() => {
  const video = document.getElementById('v');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const msg = document.getElementById('msg');
  const gainEl = document.getElementById('gain');
  const hueEl = document.getElementById('hue');
  const rainbowEl = document.getElementById('rainbow');
  const modeEl = document.getElementById('mode');
  const aurEl = document.getElementById('aur');
  const edgesEl = document.getElementById('edges');

  const LUT = new Uint8Array(360 * 3);
  for (let h = 0; h < 360; h++) {
    const hh = h / 60;
    const x = Math.round(255 * (1 - Math.abs((hh % 2) - 1)));
    let r = 0, g = 0, b = 0;
    if (hh < 1)      { r = 255; g = x; }
    else if (hh < 2) { r = x;   g = 255; }
    else if (hh < 3) { g = 255; b = x; }
    else if (hh < 4) { g = x;   b = 255; }
    else if (hh < 5) { r = x;   b = 255; }
    else             { r = 255; b = x; }
    LUT[h*3] = r; LUT[h*3+1] = g; LUT[h*3+2] = b;
  }

  const edgeCanvas = document.createElement('canvas');
  const ectx = edgeCanvas.getContext('2d');
  const tmp = document.createElement('canvas');
  const tctx = tmp.getContext('2d', { willReadFrequently: true });
  const tint = document.createElement('canvas');
  const kctx = tint.getContext('2d');
  const rays = document.createElement('canvas');
  const rctx = rays.getContext('2d');

  let stream = null, raf = null, running = false;
  let facing = 'user';

  async function startCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 480 }, height: { ideal: 360 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      canvas.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
      msg.textContent = '运行中：切换“风格”，拖动“强度”';
      return true;
    } catch (e) {
      msg.textContent = '无法访问摄像头：' + e.name + ' ' + e.message;
      return false;
    }
  }

  function reset() {
    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // 整体调色：color 模式做双色调，overlay 加对比，screen 抬黑位
  function grade(W, H, t, stops, aColor, aOver, aScreen) {
    const sh = 0.2 * Math.sin(t * 0.3);
    const g = ctx.createLinearGradient(W * sh, 0, W * (1 - sh), H);
    stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
    ctx.fillStyle = g;
    ctx.globalCompositeOperation = 'color';
    ctx.globalAlpha = Math.min(1, aColor);
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = Math.min(1, aOver);
    ctx.fillRect(0, 0, W, H);
    if (aScreen > 0) {
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = Math.min(1, aScreen);
      ctx.fillRect(0, 0, W, H);
    }
    reset();
  }

  // 高光泛光：只取画面亮部，模糊后叠回去
  function bloom(W, H, a, blur) {
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = Math.min(1, a);
    ctx.filter = 'brightness(0.85) contrast(1.9) saturate(1.6) blur(' + blur + 'px)';
    ctx.drawImage(video, 0, 0, W, H);
    reset();
  }

  // 色差重影：红粉、青蓝两层错位
  function ghost(W, H, color, dx, a) {
    kctx.globalCompositeOperation = 'source-over';
    kctx.drawImage(video, 0, 0, W, H);
    kctx.globalCompositeOperation = 'multiply';
    kctx.fillStyle = color;
    kctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(tint, dx, 0);
    reset();
  }

  // 漏光
  function leak(W, H, t, hueA, hueB, s) {
    const R = Math.max(W, H);
    ctx.globalCompositeOperation = 'screen';
    let x = W * (0.05 + 0.12 * Math.sin(t * 0.3)), y = H * (0.35 + 0.15 * Math.cos(t * 0.23));
    let g = ctx.createRadialGradient(x, y, 0, x, y, R * 0.65);
    g.addColorStop(0, 'hsla(' + hueA + ',100%,60%,' + (0.55 * s) + ')');
    g.addColorStop(1, 'hsla(' + hueA + ',100%,55%,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    x = W * (0.95 - 0.12 * Math.sin(t * 0.27 + 1)); y = H * (0.85 + 0.1 * Math.sin(t * 0.31));
    g = ctx.createRadialGradient(x, y, 0, x, y, R * 0.7);
    g.addColorStop(0, 'hsla(' + hueB + ',100%,58%,' + (0.5 * s) + ')');
    g.addColorStop(1, 'hsla(' + hueB + ',100%,55%,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    reset();
  }

  // 闪粉
  function sparkles(W, H, t, s) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 30; i++) {
      const fx = Math.abs((Math.sin(i * 127.1) * 43758.5453) % 1);
      const fy = Math.abs((Math.sin(i * 311.7) * 43758.5453) % 1);
      const x = fx * W;
      const y = (((fy - t * 0.015 * (1 + i % 3)) % 1) + 1) % 1 * H;
      const tw = 0.5 + 0.5 * Math.sin(t * 2.5 + i * 1.9);
      const r = (2 + 5 * tw) * (W / 480);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
      g.addColorStop(0, 'rgba(255,255,255,' + (0.9 * tw * s) + ')');
      g.addColorStop(0.3, 'rgba(255,170,255,' + (0.4 * tw * s) + ')');
      g.addColorStop(1, 'rgba(255,170,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
    }
    reset();
  }

  function vignette(W, H, a) {
    const R = Math.max(W, H);
    const g = ctx.createRadialGradient(W / 2, H / 2, R * 0.3, W / 2, H / 2, R * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,' + a + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    reset();
  }

  // 极光光幕：许多竖向光线，高度和颜色随时间流动
  function drawRays(W, H, t, s) {
    rctx.clearRect(0, 0, W, H);
    rctx.globalCompositeOperation = 'lighter';
    const lw = Math.max(3, Math.round(W / 160));
    rctx.lineWidth = lw;
    for (let x = 0; x < W; x += lw) {
      const n = 0.5 + 0.5 * Math.sin(x * 0.045 + t * 1.1) * Math.sin(x * 0.013 - t * 0.4);
      const top = H * (0.10 + 0.12 * Math.sin(x * 0.011 + t * 0.35) + 0.05 * Math.sin(x * 0.03 - t * 0.9));
      const len = H * (0.25 + 0.45 * n);
      const h = 125 + 90 * (x / W) + 30 * Math.sin(t * 0.4 + x * 0.01);
      const g = rctx.createLinearGradient(0, top, 0, top + len);
      g.addColorStop(0,    'hsla(' + h + ',100%,60%,0)');
      g.addColorStop(0.25, 'hsla(' + h + ',100%,62%,0.95)');
      g.addColorStop(0.7,  'hsla(' + (h + 60) + ',100%,58%,0.5)');
      g.addColorStop(1,    'hsla(' + (h + 90) + ',100%,55%,0)');
      rctx.strokeStyle = g;
      rctx.globalAlpha = 0.25 + 0.75 * n;
      rctx.beginPath();
      rctx.moveTo(x + lw / 2, top);
      rctx.lineTo(x + lw / 2, top + len);
      rctx.stroke();
    }
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = Math.min(1, s * 1.1);
    ctx.filter = 'blur(1.5px)';
    ctx.drawImage(rays, 0, 0);
    ctx.globalAlpha = Math.min(1, s * 0.9);
    ctx.filter = 'blur(12px)';
    ctx.drawImage(rays, 0, 0);
    reset();
  }

  function fxEuphoria(W, H, t, s) {
    grade(W, H, t, ['#ff2fb9', '#7a3cff', '#19c3ff'], 0.6 * s, 0.9 * s, 0.10 * s);
    bloom(W, H, 0.6 * s, 10);
    const dx = W * 0.008 * (0.7 + 0.3 * Math.sin(t * 0.8));
    ghost(W, H, '#ff2fb9', -dx, 0.35 * s);
    ghost(W, H, '#19c3ff', dx, 0.35 * s);
    leak(W, H, t, 320, 215, s);
    sparkles(W, H, t, s);
    vignette(W, H, 0.55);
  }

  function fxAurora(W, H, t, s) {
    grade(W, H, t, ['#0a1a5c', '#0b6b8a', '#2a1a6e'], 0.6 * s, 0.5 * s, 0);
    drawRays(W, H, t, s);
    bloom(W, H, 0.25 * s, 12);
    vignette(W, H, 0.45);
  }

  function fxDream(W, H, t, s) {
    const dx = W * 0.012 * (0.6 + 0.4 * Math.sin(t * 0.6));
    ctx.globalCompositeOperation = 'screen';
    ctx.filter = 'blur(4px) saturate(1.3)';
    for (let k = 1; k <= 5; k++) {
      ctx.globalAlpha = 0.12 * s * (1 - k / 6);
      ctx.drawImage(video, -dx * k, 0, W, H);
    }
    reset();
    grade(W, H, t, ['#ff9a3c', '#c9b6ff', '#7f8cff'], 0.35 * s, 0.6 * s, 0.08 * s);
    leak(W, H, t, 28, 255, s);
    bloom(W, H, 0.6 * s, 14);
    vignette(W, H, 0.3);
  }

  function frame() {
    if (!running) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const W = video.videoWidth, H = video.videoHeight;
      if (canvas.width !== W || canvas.height !== H) {
        canvas.width = W; canvas.height = H;
        edgeCanvas.width = W; edgeCanvas.height = H;
        tmp.width = W; tmp.height = H;
        tint.width = W; tint.height = H;
        rays.width = W; rays.height = H;
      }
      const mode = modeEl.value;
      const s = +aurEl.value / 100;
      const t = performance.now() / 1000;

      reset();
      const base = {
        euphoria: 'brightness(0.62) contrast(1.35) saturate(0.6)',
        aurora:   'brightness(0.38) contrast(1.2) saturate(0.4)',
        dream:    'brightness(0.8) contrast(1.1) saturate(0.9)',
        off:      'brightness(0.25) saturate(0.35)'
      }[mode];
      ctx.filter = base;
      ctx.drawImage(video, 0, 0, W, H);
      ctx.filter = 'none';

      if (mode === 'euphoria') fxEuphoria(W, H, t, s);
      else if (mode === 'aurora') fxAurora(W, H, t, s);
      else if (mode === 'dream') fxDream(W, H, t, s);

      if (edgesEl.checked) {
        tctx.drawImage(video, 0, 0, W, H);
        const d = tctx.getImageData(0, 0, W, H).data;
        const gray = new Uint8Array(W * H);
        for (let i = 0, j = 0; i < d.length; i += 4, j++) {
          gray[j] = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8;
        }
        const out = ectx.createImageData(W, H);
        const od = out.data;
        const th = +gainEl.value;
        const hueOff = +hueEl.value;
        const rainbow = rainbowEl.checked;
        for (let y = 1; y < H - 1; y++) {
          const row = y * W;
          for (let x = 1; x < W - 1; x++) {
            const i = row + x;
            const gx = -gray[i-W-1] - 2*gray[i-1] - gray[i+W-1]
                       + gray[i-W+1] + 2*gray[i+1] + gray[i+W+1];
            const gy = -gray[i-W-1] - 2*gray[i-W] - gray[i-W+1]
                       + gray[i+W-1] + 2*gray[i+W] + gray[i+W+1];
            const mag = Math.sqrt(gx * gx + gy * gy);
            const p = i * 4;
            if (mag > th) {
              let hue;
              if (rainbow) {
                hue = (Math.atan2(gy, gx) * 57.2958 + 180 + hueOff) % 360;
                if (hue < 0) hue += 360;
              } else { hue = hueOff; }
              const k = (hue | 0) * 3;
              od[p] = LUT[k]; od[p+1] = LUT[k+1]; od[p+2] = LUT[k+2];
              od[p+3] = 255;
            } else { od[p+3] = 0; }
          }
        }
        ectx.putImageData(out, 0, 0);

        ctx.globalCompositeOperation = 'lighter';
        ctx.filter = 'blur(12px) brightness(0.85)';
        ctx.drawImage(edgeCanvas, 0, 0);
        ctx.filter = 'blur(4px) brightness(1.15)';
        ctx.drawImage(edgeCanvas, 0, 0);
        ctx.filter = 'blur(1px) brightness(1.9)';
        ctx.drawImage(edgeCanvas, 0, 0);
        reset();
      }
    }
    raf = requestAnimationFrame(frame);
  }

  function savePhoto() {
    if (!running) { msg.textContent = '请先开启摄像头'; return; }
    const W = canvas.width, H = canvas.height;
    const snap = document.createElement('canvas');
    snap.width = W; snap.height = H;
    const sctx = snap.getContext('2d');
    if (facing === 'user') {
      sctx.translate(W, 0);
      sctx.scale(-1, 1);
    }
    sctx.drawImage(canvas, 0, 0);
    snap.toBlob(blob => {
      if (!blob) { msg.textContent = '保存失败'; return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const t = new Date();
      const pad = n => String(n).padStart(2, '0');
      a.href = url;
      a.download = 'neon_' + t.getFullYear() + pad(t.getMonth()+1) + pad(t.getDate())
                   + '_' + pad(t.getHours()) + pad(t.getMinutes()) + pad(t.getSeconds()) + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      msg.textContent = '已保存：' + a.download + '（在手机“下载”文件夹里）';
    }, 'image/png');
  }

  document.getElementById('start').onclick = async () => {
    if (running) return;
    if (await startCam()) { running = true; frame(); }
  };
  document.getElementById('shot').onclick = savePhoto;
  document.getElementById('flip').onclick = async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    if (running) await startCam();
  };
  document.getElementById('stop').onclick = () => {
    running = false;
    cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    msg.textContent = '已停止';
  };
})();
</script>
</body>
</html>
