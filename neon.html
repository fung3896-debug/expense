<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>霓虹边缘 + 极光</title>
<style>
  :root {
    --bg: #f4f4f6; --fg: #1d1d22; --muted: #666;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #ddd; --muted: #999; color-scheme: dark; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:sans-serif; font-size:14px; }
  .bar { padding:8px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  canvas { width:100%; display:block; background:#000; }
  button { padding:6px 12px; font-size:14px; }
  label { display:flex; align-items:center; gap:4px; }
  #msg { padding:0 8px; color:var(--muted); }
</style>
</head>
<body>
<video id="v" autoplay playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>

<div class="bar">
  <label>阈值 <input id="gain" type="range" min="15" max="200" value="60"></label>
  <label>色相 <input id="hue" type="range" min="0" max="359" value="0"></label>
  <label><input id="rainbow" type="checkbox" checked> 彩虹</label>
  <label><input id="aurora" type="checkbox" checked> 极光</label>
  <label>强度 <input id="aur" type="range" min="0" max="100" value="55"></label>
  <label><input id="edges" type="checkbox" checked> 边缘</label>
  <button id="start">开启摄像头</button>
  <button id="shot">拍照保存</button>
  <button id="flip">切换前后摄像头</button>
  <button id="stop">停止</button>
</div>
<canvas id="c" width="480" height="360"></canvas>
<p id="msg">点“开启摄像头”开始。</p>

<script>
(() => {
  const video = document.getElementById('v');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const msg = document.getElementById('msg');
  const gainEl = document.getElementById('gain');
  const hueEl = document.getElementById('hue');
  const rainbowEl = document.getElementById('rainbow');
  const auroraEl = document.getElementById('aurora');
  const aurEl = document.getElementById('aur');
  const edgesEl = document.getElementById('edges');

  const LUT = new Uint8Array(360 * 3);
  for (let h = 0; h < 360; h++) {
    const hh = h / 60;
    const x = Math.round(255 * (1 - Math.abs((hh % 2) - 1)));
    let r = 0, g = 0, b = 0;
    if (hh < 1)      { r = 255; g = x; }
    else if (hh < 2) { r = x;   g = 255; }
    else if (hh < 3) { g = 255; b = x; }
    else if (hh < 4) { g = x;   b = 255; }
    else if (hh < 5) { r = x;   b = 255; }
    else             { r = 255; b = x; }
    LUT[h*3] = r; LUT[h*3+1] = g; LUT[h*3+2] = b;
  }

  const edgeCanvas = document.createElement('canvas');
  const ectx = edgeCanvas.getContext('2d');
  const tmp = document.createElement('canvas');
  const tctx = tmp.getContext('2d', { willReadFrequently: true });

  let stream = null, raf = null, running = false;
  let facing = 'user';

  async function startCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facing }, width: { ideal: 480 }, height: { ideal: 360 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      canvas.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
      msg.textContent = '运行中：拖动滑块调阈值、色相、极光强度';
      return true;
    } catch (e) {
      msg.textContent = '无法访问摄像头：' + e.name + ' ' + e.message;
      return false;
    }
  }

  // 极光：漂移光斑 + 对角光带 + 横向拖影 + 柔光
  function drawAurora(W, H, strength, t) {
    const s = strength;

    // 1) 横向拖影（像照片里的动态模糊）
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(5px) brightness(0.9) saturate(1.4)';
    const steps = 6;
    const dx = W * 0.012 * (0.6 + 0.4 * Math.sin(t * 0.6));
    for (let k = 1; k <= steps; k++) {
      ctx.globalAlpha = 0.09 * s * (1 - k / (steps + 1));
      ctx.drawImage(video, -dx * k, 0, W, H);
      ctx.drawImage(video, dx * k * 0.5, 0, W, H);
    }
    ctx.filter = 'none';

    // 2) 漂移的彩色光斑（橙 / 紫 / 洋红 / 青蓝）
    ctx.globalCompositeOperation = 'screen';
    const blobs = [
      { h: 28,  x: 0.30 + 0.22 * Math.sin(t * 0.35),       y: 0.30 + 0.18 * Math.cos(t * 0.28), r: 0.65, a: 0.85 },
      { h: 265, x: 0.75 + 0.18 * Math.cos(t * 0.30 + 1),   y: 0.70 + 0.20 * Math.sin(t * 0.33), r: 0.70, a: 0.70 },
      { h: 325, x: 0.55 + 0.25 * Math.sin(t * 0.22 + 2),   y: 0.25 + 0.15 * Math.cos(t * 0.40), r: 0.50, a: 0.55 },
      { h: 195, x: 0.15 + 0.12 * Math.cos(t * 0.26 + 4),   y: 0.80 + 0.12 * Math.sin(t * 0.31), r: 0.55, a: 0.45 }
    ];
    const R = Math.max(W, H);
    for (const b of blobs) {
      const cx = b.x * W, cy = b.y * H, rr = b.r * R;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
      g.addColorStop(0,   'hsla(' + b.h + ',100%,60%,' + (0.55 * b.a * s) + ')');
      g.addColorStop(0.5, 'hsla(' + b.h + ',90%,50%,'  + (0.20 * b.a * s) + ')');
      g.addColorStop(1,   'hsla(' + b.h + ',90%,50%,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // 3) 对角光带（像照片左上方斜射过来的那道光）
    const ang = -0.6 + 0.15 * Math.sin(t * 0.25);
    const cx = W * (0.35 + 0.2 * Math.sin(t * 0.18));
    const cy = H * 0.35;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    const lg = ctx.createLinearGradient(0, -H * 0.35, 0, H * 0.35);
    lg.addColorStop(0,    'hsla(30,100%,65%,0)');
    lg.addColorStop(0.5,  'hsla(35,100%,70%,' + (0.38 * s) + ')');
    lg.addColorStop(1,    'hsla(30,100%,65%,0)');
    ctx.globalAlpha = 1;
    ctx.filter = 'blur(10px)';
    ctx.fillStyle = lg;
    ctx.fillRect(-R, -H * 0.35, R * 2, H * 0.7);
    ctx.restore();
    ctx.filter = 'none';

    // 4) 柔光雾化（整体发梦幻光晕）
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(14px) brightness(0.8) saturate(1.3)';
    ctx.globalAlpha = 0.28 * s;
    ctx.drawImage(video, 0, 0, W, H);

    ctx.filter = 'none';
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function frame() {
    if (!running) return;
    if (video.readyState >= 2 && video.videoWidth) {
      const W = video.videoWidth, H = video.videoHeight;
      if (canvas.width !== W || canvas.height !== H) {
        canvas.width = W; canvas.height = H;
        edgeCanvas.width = W; edgeCanvas.height = H;
        tmp.width = W; tmp.height = H;
      }
      const useEdges = edgesEl.checked;
      const useAurora = auroraEl.checked;
      const t = performance.now() / 1000;

      // 底图：极光开启时稍亮一点，否则保持原来的暗底
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.filter = useAurora
        ? 'brightness(0.45) saturate(0.6)'
        : 'brightness(0.25) saturate(0.35)';
      ctx.drawImage(video, 0, 0, W, H);
      ctx.filter = 'none';

      if (useAurora) drawAurora(W, H, +aurEl.value / 100, t);

      if (useEdges) {
        tctx.drawImage(video, 0, 0, W, H);
        const d = tctx.getImageData(0, 0, W, H).data;
        const gray = new Uint8Array(W * H);
        for (let i = 0, j = 0; i < d.length; i += 4, j++) {
          gray[j] = (d[i] * 77 + d[i+1] * 150 + d[i+2] * 29) >> 8;
        }
        const out = ectx.createImageData(W, H);
        const od = out.data;
        const th = +gainEl.value;
        const hueOff = +hueEl.value;
        const rainbow = rainbowEl.checked;
        for (let y = 1; y < H - 1; y++) {
          const row = y * W;
          for (let x = 1; x < W - 1; x++) {
            const i = row + x;
            const gx = -gray[i-W-1] - 2*gray[i-1] - gray[i+W-1]
                       + gray[i-W+1] + 2*gray[i+1] + gray[i+W+1];
            const gy = -gray[i-W-1] - 2*gray[i-W] - gray[i-W+1]
                       + gray[i+W-1] + 2*gray[i+W] + gray[i+W+1];
            const mag = Math.sqrt(gx * gx + gy * gy);
            const p = i * 4;
            if (mag > th) {
              let hue;
              if (rainbow) {
                hue = (Math.atan2(gy, gx) * 57.2958 + 180 + hueOff) % 360;
                if (hue < 0) hue += 360;
              } else { hue = hueOff; }
              const k = (hue | 0) * 3;
              od[p] = LUT[k]; od[p+1] = LUT[k+1]; od[p+2] = LUT[k+2];
              od[p+3] = 255;
            } else { od[p+3] = 0; }
          }
        }
        ectx.putImageData(out, 0, 0);

        ctx.globalCompositeOperation = 'lighter';
        ctx.filter = 'blur(12px) brightness(0.85)';
        ctx.drawImage(edgeCanvas, 0, 0);
        ctx.filter = 'blur(4px) brightness(1.15)';
        ctx.drawImage(edgeCanvas, 0, 0);
        ctx.filter = 'blur(1px) brightness(1.9)';
        ctx.drawImage(edgeCanvas, 0, 0);
        ctx.filter = 'none';
        ctx.globalCompositeOperation = 'source-over';
      }
    }
    raf = requestAnimationFrame(frame);
  }

  function savePhoto() {
    if (!running) { msg.textContent = '请先开启摄像头'; return; }
    const W = canvas.width, H = canvas.height;
    const snap = document.createElement('canvas');
    snap.width = W; snap.height = H;
    const sctx = snap.getContext('2d');
    if (facing === 'user') {
      sctx.translate(W, 0);
      sctx.scale(-1, 1);
    }
    sctx.drawImage(canvas, 0, 0);
    snap.toBlob(blob => {
      if (!blob) { msg.textContent = '保存失败'; return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const t = new Date();
      const pad = n => String(n).padStart(2, '0');
      a.href = url;
      a.download = 'neon_' + t.getFullYear() + pad(t.getMonth()+1) + pad(t.getDate())
                   + '_' + pad(t.getHours()) + pad(t.getMinutes()) + pad(t.getSeconds()) + '.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      msg.textContent = '已保存：' + a.download + '（在手机“下载”文件夹里）';
    }, 'image/png');
  }

  document.getElementById('start').onclick = async () => {
    if (running) return;
    if (await startCam()) { running = true; frame(); }
  };
  document.getElementById('shot').onclick = savePhoto;
  document.getElementById('flip').onclick = async () => {
    facing = facing === 'user' ? 'environment' : 'user';
    if (running) await startCam();
  };
  document.getElementById('stop').onclick = () => {
    running = false;
    cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    msg.textContent = '已停止';
  };
})();
</script>
</body>
</html>
